[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbim-data-backend"
version = "0.2.0"
description = "Open-source Python backend and CLI for ingesting, validating, diffing, and serving IFC/openBIM data."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.8.0", "python-multipart>=0.0.9", "ifcopenshell>=0.8.0", "pandas>=2.2.0", "pandera>=0.20.0", "ifctester>=0.8.0", "sqlalchemy>=2.0.0", "pydantic-settings>=2.0.0", "minio>=7.2.0"]

[project.scripts]
openbim = "app.cli:main"
