services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbim-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://openbim:openbim@db:5432/openbim
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: openbim
      MINIO_SECRET_KEY: openbim-secret
      MINIO_BUCKET: openbim-models
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgis/postgis:16-3.4
    container_name: openbim-db
    environment:
      POSTGRES_DB: openbim
      POSTGRES_USER: openbim
      POSTGRES_PASSWORD: openbim
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: openbim-redis

  minio:
    image: minio/minio:latest
    container_name: openbim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openbim
      MINIO_ROOT_PASSWORD: openbim-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
